<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Pomodoro</title><style>
:root{color-scheme:dark;--green:#448361;--bg:#191919;--line:#303630}*{box-sizing:border-box}body{margin:0;padding:18px;background:var(--bg);color:var(--green);font-family:Arial,Helvetica,sans-serif}.card{max-width:740px;margin:auto;padding:36px 20px;border:1px solid var(--line);border-radius:16px;text-align:center}.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font:inherit;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:30px;padding:10px 26px;cursor:pointer}button:hover{border-color:var(--green)}button:focus-visible{outline:2px solid var(--green);outline-offset:4px}.active,#start{background:var(--green);color:#fff;border-color:var(--green)}.clock{font-size:clamp(72px,19vw,132px);font-weight:700;letter-spacing:-6px;margin:24px 0 28px;font-variant-numeric:tabular-nums;line-height:1.1}.controls{display:flex;justify-content:center;align-items:center;gap:18px}#start{font-size:20px;font-weight:700;min-width:112px}.reset{font-size:28px;border:0;padding:4px 12px}#status{font-size:13px;min-height:18px;margin-top:16px}@media(max-width:440px){.card{padding:28px 8px}.tabs{gap:5px}.tabs button{font-size:12px;padding:9px 10px}.clock{letter-spacing:-3px}}
</style></head><body><main class="card"><nav class="tabs" aria-label="Timer mode"><button class="active" data-mode="0" aria-pressed="true">Pomodoro</button><button data-mode="1" aria-pressed="false">Short Break</button><button data-mode="2" aria-pressed="false">Long Break</button></nav><div class="clock" id="clock" role="timer" aria-label="Time remaining">25:00</div><div class="controls"><button id="start">Start</button><button class="reset" id="reset" aria-label="Reset timer" title="Reset timer">↻</button></div><div id="status" role="status" aria-live="polite"></div></main><script>
const clock=document.getElementById('clock'),start=document.getElementById('start'),status=document.getElementById('status'),lengths=[1500,300,900],names=['Pomodoro','Short break','Long break'];let mode=0,left=1500,running=false,deadline=0;
function render(){let s=Math.max(0,Math.ceil(left));clock.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.title=clock.textContent+' · '+names[mode]}
function pause(){if(running)left=Math.max(0,(deadline-Date.now())/1000);running=false;start.textContent='Start';render()}
function reset(){pause();left=lengths[mode];status.textContent='';render()}
function tick(){if(!running)return;left=Math.max(0,(deadline-Date.now())/1000);render();if(left<=0){running=false;start.textContent='Start';status.textContent=names[mode]+' complete — choose your next session.'}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=Number(b.dataset.mode);document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});reset()});
start.onclick=()=>{if(running){pause();return}if(left<=0)left=lengths[mode];deadline=Date.now()+left*1000;running=true;start.textContent='Pause';status.textContent=''};document.getElementById('reset').onclick=reset;setInterval(tick,200);document.addEventListener('visibilitychange',tick);render();
</script></body></html>
